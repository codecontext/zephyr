name: Zephyr CI

on:
  workflow_dispatch:

  push:
    branches:
      - zephyr-4.3.0
      - development
      - feature/**

  pull_request:
    branches:
      - zephyr-4.3.0
      - development

jobs:
  repository-check:
    name: Repository Checkout Check

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show current directory
        run: pwd

      - name: Show Git information
        run: |
          git --version
          git branch --show-current
          git log -1 --oneline

      - name: List repository contents
        run: ls -la

      - name: Verify Zephyr source tree
        run: |
          echo "Checking important Zephyr directories..."

          test -d drivers
          test -d kernel
          test -d samples
          test -d tests

          echo "Zephyr source tree validation successful!"

  prepare-build-environment:
    name: Prepare Build Environment

    runs-on: ubuntu-latest

    needs: repository-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ubuntu packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ninja-build \
            cmake \
            device-tree-compiler \
            graphviz \
            git

      - name: Install Zephyr Python tools
        run: |
          python -m pip install --upgrade pip
          pip install west
          pip install -r scripts/requirements.txt

      - name: Verify build environment
        run: |
          echo "===== Tool Versions ====="

          python --version
          pip --version
          west --version

          cmake --version
          ninja --version
          dtc --version
          gcc --version
          git --version

          echo "Build environment is ready."

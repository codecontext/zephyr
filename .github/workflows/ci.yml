name: Zephyr CI

on:
  workflow_dispatch:

  push:
    branches:
      - zephyr-4.3.0
      - development
      - feature/**

  pull_request:
    branches:
      - zephyr-4.3.0
      - development

jobs:
  repository-check:
    name: Repository Checkout Check

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show current directory
        run: pwd

      - name: Show Git information
        run: |
          git --version
          git branch --show-current
          git log -1 --oneline

      - name: List repository contents
        run: ls -la

      - name: Verify Zephyr source tree
        run: |
          echo "Checking important Zephyr directories..."

          test -d drivers
          test -d kernel
          test -d samples
          test -d tests

          echo "Zephyr source tree validation successful!"

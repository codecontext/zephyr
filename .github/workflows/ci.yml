name: Zephyr CI

on:
  push:
    branches:
      - zephyr-4.3.0
      - feature/**
  pull_request:
    branches:
      - zephyr-4.3.0

jobs:
  repository-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show current directory
        run: pwd

      - name: List repository contents
        run: ls -la

      - name: Verify Zephyr source
        run: |
          echo "Checking important directories..."
          ls drivers
          ls kernel
          ls samples

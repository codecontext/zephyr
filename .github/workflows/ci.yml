name: First GitHub Actions Workflow

on:
  push:
    branches:
      - zephyr-4.3.0
      - feature/**

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Print greeting
        run: |
          echo "Hello from GitHub Actions!"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
